<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="GrabAll — Fast All-in-One Android Media Downloader, Ad-Free YouTube and Music Player">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F18"/>
      <stop offset="55%" stop-color="#141625"/>
      <stop offset="100%" stop-color="#1B1226"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00">
        <animate attributeName="stop-color" values="#FF7A00;#FF4D6D;#FF7A00" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FF477E">
        <animate attributeName="stop-color" values="#FF477E;#FF9100;#FF477E" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF2E93">
        <animate attributeName="stop-color" values="#FF2E93;#FF6B00;#FF2E93" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#FF2E93" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FF2E93" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.0"/>
      <stop offset="25%" stop-color="#FF7A00" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#FF2E93" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF2E93" stop-opacity="0.0"/>
    </linearGradient>

    <clipPath id="rounded">
      <rect width="1200" height="320" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Deep Dark Card Background -->
    <rect width="1200" height="320" fill="url(#bgGrad)"/>
    <rect width="1200" height="320" fill="url(#glowLeft)"/>
    <rect width="1200" height="320" fill="url(#glowRight)"/>

    <!-- Subtle Top Gradient Bar -->
    <rect x="0" y="0" width="1200" height="5" fill="url(#accentGrad)"/>

    <!-- Animated Flowing Audio Wave Background -->
    <path fill="none" stroke="url(#waveGrad)" stroke-width="2.5" opacity="0.65">
      <animate attributeName="d" dur="5s" repeatCount="indefinite"
        values="M0,250 Q150,210 300,250 T600,250 T900,250 T1200,250;
                M0,250 Q150,285 300,250 T600,250 T900,250 T1200,250;
                M0,250 Q150,210 300,250 T600,250 T900,250 T1200,250"/>
    </path>
    <path fill="none" stroke="url(#waveGrad)" stroke-width="1.5" opacity="0.35">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M0,265 Q180,295 360,265 T720,265 T1080,265 T1200,265;
                M0,265 Q180,235 360,265 T720,265 T1080,265 T1200,265;
                M0,265 Q180,295 360,265 T720,265 T1080,265 T1200,265"/>
    </path>

    <!-- App Icon Emblem (Left) -->
    <g transform="translate(76, 84)">
      <rect width="116" height="116" rx="28" fill="url(#accentGrad)"/>
      <rect x="4" y="4" width="108" height="108" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
      <!-- Download Arrow + Play Spark -->
      <path d="M58 28 L58 72 M38 54 L58 74 L78 54" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <animateTransform attributeName="transform" type="translate" values="0,-3;0,3;0,-3" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <rect x="32" y="84" width="52" height="7" rx="3.5" fill="#FFFFFF" opacity="0.95"/>
    </g>

    <!-- Title & Tagline -->
    <text x="224" y="138" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">
      Grab<tspan fill="url(#accentGrad)">All</tspan>
    </text>

    <text x="226" y="176" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#CBD5E1">
      High-Speed Android Downloader · Ad-Free YouTube · Offline Music Player
    </text>

    <!-- Feature Pills -->
    <g transform="translate(226, 202)" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="600">
      <rect x="0" y="0" width="166" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FF7A00" stroke-opacity="0.45"/>
      <text x="83" y="21" text-anchor="middle" fill="#FFE4CC">⚡ Parallel Playlists</text>

      <rect x="178" y="0" width="162" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FF477E" stroke-opacity="0.45"/>
      <text x="259" y="21" text-anchor="middle" fill="#FFD6E5">📺 Ad-Free YouTube</text>

      <rect x="352" y="0" width="176" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#A855F7" stroke-opacity="0.45"/>
      <text x="440" y="21" text-anchor="middle" fill="#E9D5FF">🎵 20+ Audio Formats</text>

      <rect x="540" y="0" width="142" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#22C55E" stroke-opacity="0.45"/>
      <text x="611" y="21" text-anchor="middle" fill="#DCFCE7">🔒 100% On-Device</text>
    </g>

    <!-- Animated Audio Equalizer Bars (Right) -->
    <g transform="translate(996, 98)">
      <rect x="0" y="34" width="12" height="72" rx="6" fill="url(#accentGrad)">
        <animate attributeName="height" values="36;92;48;80;36" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="70;14;58;26;70" dur="1.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="22" y="18" width="12" height="88" rx="6" fill="url(#accentGrad)">
        <animate attributeName="height" values="84;32;96;44;84" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="22;74;10;62;22" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="44" y="42" width="12" height="64" rx="6" fill="url(#accentGrad)">
        <animate attributeName="height" values="52;100;34;76;52" dur="1.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="54;6;72;30;54" dur="1.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="66" y="10" width="12" height="96" rx="6" fill="url(#accentGrad)">
        <animate attributeName="height" values="92;40;78;28;92" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="14;66;28;78;14" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="88" y="30" width="12" height="76" rx="6" fill="url(#accentGrad)">
        <animate attributeName="height" values="42;88;58;98;42" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="64;18;48;8;64" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="110" y="48" width="12" height="58" rx="6" fill="url(#accentGrad)">
        <animate attributeName="height" values="64;26;82;46;64" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="42;80;24;60;42" dur="1.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Border Stroke -->
    <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="22" ry="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5"/>
  </g>
</svg>
