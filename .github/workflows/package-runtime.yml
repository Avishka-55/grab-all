name: Package runtime

# Builds the native runtime zips RuntimeExtractor expects in
# assets/runtime/ for the universal app: both armeabi-v7a (32-bit) and
# arm64-v8a (64-bit). yt-dlp is pure Python, so it is built once and
# shared. Python is split into a shared zip (arch-independent stdlib
# .py files) plus a per-arch zip (native .so files + interpreter);
# the dead libpython3.13.a static library is excluded from both.
# Manual trigger only: `gh workflow run package-runtime.yml`.
# Each job uploads its zip (or probe files) as an artifact; jobs are
# independent, so one failing does not block the others.

on:
  workflow_dispatch:
  push:
    tags: [ 'runtime-*' ]

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure internal draft release exists for runtime zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view runtime-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create runtime-latest --repo "${{ github.repository }}" \
              --prerelease --title "Runtime assets (internal)" \
              --notes "Internal native runtime zips for GrabAll (not a user release)."
          fi

  ytdlp:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Build yt-dlp package zip
        run: |
          rm -rf ytdlp-build && mkdir -p ytdlp-build/pkg
          cd ytdlp-build
          python3 -m pip download "yt-dlp[default]" -d wheels
          ls wheels
          cd pkg
          for w in ../wheels/*.whl; do python3 -m zipfile -e "$w" .; done
          printf 'import sys\nfrom yt_dlp import main\nsys.exit(main())\n' > yt-dlp
          cd ..
          python3 - <<'EOF'
          import zipfile, os
          # Skip dist-info, pycache, and host x86_64 native .so extensions
          # downloaded by pip on this Ubuntu runner — they cannot load on
          # ARM Android and add ~8.5 MB of dead weight (e.g. _brotli,
          # Cryptodome x86_64 .abi3.so, charset_normalizer, websockets).
          skip = ('.dist-info', '__pycache__')
          with zipfile.ZipFile('ytdlp.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk('pkg'):
                  for f in files:
                      if f.endswith('.so'):
                          continue
                      p = os.path.join(root, f)
                      rel = os.path.relpath(p, 'pkg')
                      if any(s in rel for s in skip):
                          continue
                      z.write(p, rel)
          EOF
          ls -la ytdlp.zip
          python3 -c "import zipfile; names=zipfile.ZipFile('ytdlp.zip').namelist(); assert not any(n.endswith('.so') for n in names), 'x86_64 .so leaked into ytdlp.zip'; assert 'certifi/cacert.pem' in names, 'certifi cacert.pem missing'; print('entries:', len(names), 'first 8:', sorted(names)[:8])"
      - name: Upload ytdlp.zip to runtime-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload runtime-latest ytdlp-build/ytdlp.zip --repo "${{ github.repository }}" --clobber

  qjs:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Cross-compile QuickJS for armeabi-v7a
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          curl -fsSL --retry 3 -o quickjs.tar.xz https://bellard.org/quickjs/quickjs-2026-06-04.tar.xz
          tar xf quickjs.tar.xz
          # Host build first: its runnable qjsc generates repl.c.
          # The cross Makefile would try to RUN the ARM qjsc on this x86
          # runner, which fails, so the target binary is compiled with one
          # direct clang invocation instead. bionic bundles pthread into
          # libc, so no -lpthread on the target link.
          cp -r quickjs-2026-06-04 quickjs-host
          (cd quickjs-host && make qjs -j"$(nproc)")
          cp quickjs-host/repl.c quickjs-2026-06-04/
          cd quickjs-2026-06-04
          "$NDK_BIN/armv7a-linux-androideabi21-clang" -O2 -fwrapv \
            -D_GNU_SOURCE -DCONFIG_VERSION='"2026-06-04"' \
            -o qjs qjs.c repl.c quickjs.c dtoa.c libregexp.c libunicode.c \
            cutils.c quickjs-libc.c -lm -ldl
          "$NDK_BIN/llvm-strip" --strip-unneeded qjs
          mkdir -p ../qjs-pkg/bin
          cp qjs ../qjs-pkg/bin/qjs
          cd ..
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile('qjs32.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('qjs-pkg/bin/qjs', 'bin/qjs')
          EOF
          ls -la qjs32.zip
      - name: Upload qjs32.zip to runtime-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload runtime-latest qjs32.zip --repo "${{ github.repository }}" --clobber

  qjs64:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Cross-compile QuickJS for arm64-v8a
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          curl -fsSL --retry 3 -o quickjs.tar.xz https://bellard.org/quickjs/quickjs-2026-06-04.tar.xz
          tar xf quickjs.tar.xz
          # Host build first: its runnable qjsc generates repl.c.
          # The cross Makefile would try to RUN the ARM qjsc on this x86
          # runner, which fails, so the target binary is compiled with one
          # direct clang invocation instead. bionic bundles pthread into
          # libc, so no -lpthread on the target link.
          cp -r quickjs-2026-06-04 quickjs-host
          (cd quickjs-host && make qjs -j"$(nproc)")
          cp quickjs-host/repl.c quickjs-2026-06-04/
          cd quickjs-2026-06-04
          "$NDK_BIN/aarch64-linux-android21-clang" -O2 -fwrapv \
            -Wl,-z,max-page-size=16384 \
            -D_GNU_SOURCE -DCONFIG_VERSION='"2026-06-04"' \
            -o qjs qjs.c repl.c quickjs.c dtoa.c libregexp.c libunicode.c \
            cutils.c quickjs-libc.c -lm -ldl
          "$NDK_BIN/llvm-strip" --strip-unneeded qjs
          mkdir -p ../qjs-pkg/bin
          cp qjs ../qjs-pkg/bin/qjs
          cd ..
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile('qjs64.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('qjs-pkg/bin/qjs', 'bin/qjs')
          EOF
          ls -la qjs64.zip
      - name: Upload qjs64.zip to runtime-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload runtime-latest qjs64.zip --repo "${{ github.repository }}" --clobber

  ffmpeg:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Cross-compile ffmpeg for armeabi-v7a
        run: |
          set -o pipefail
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          # ffmpeg.org's TLS fails from these runners (exit 35, twice in a
          # row after two good downloads), so fetch the same release
          # from FFmpeg's GitHub mirror instead.
          curl -fsSL --retry 3 --retry-all-errors -o ffmpeg.tar.gz https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n7.1.tar.gz
          tar xf ffmpeg.tar.gz
          # libmp3lame first: the app's audio-only mode now produces real
          # MP3 (yt-dlp --extract-audio --audio-format mp3), and the
          # stock ffmpeg build has no MP3 encoder. Static, PIC (it is
          # linked into ffmpeg's PIE binary), frontend off (we only
          # need the library, not lame's CLI).
          curl -fsSL --retry 3 --retry-all-errors -o lame.tar.gz https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz
          tar xf lame.tar.gz
          cd lame-3.100
          CC="$NDK_BIN/armv7a-linux-androideabi21-clang" \
            CFLAGS="-O2 -fPIC" \
            ./configure --host=arm-linux-androideabi \
            --disable-shared --enable-static --disable-frontend \
            --prefix="$PWD/../lame-install" 2>&1 | tail -5
          make -j"$(nproc)" 2>&1 | tail -3
          make install 2>&1 | tail -3
          cd ..
          cd FFmpeg-n7.1
          ./configure \
            --target-os=android --arch=arm --cpu=armv7-a \
            --enable-cross-compile \
            --cross-prefix="$NDK_BIN/armv7a-linux-androideabi-" \
            --cc="$NDK_BIN/armv7a-linux-androideabi21-clang" \
            --ar="$NDK_BIN/llvm-ar" --ranlib="$NDK_BIN/llvm-ranlib" \
            --nm="$NDK_BIN/llvm-nm" --strip="$NDK_BIN/llvm-strip" \
            --sysroot="$SYSROOT" \
            --prefix="$PWD/../ffmpeg-install" \
            --enable-libmp3lame \
            --extra-cflags="-I$PWD/../lame-install/include" \
            --extra-ldflags="-L$PWD/../lame-install/lib" \
            --disable-doc --disable-ffplay \
            --disable-avdevice --disable-network \
            --disable-vulkan \
            --disable-everything \
            --enable-swresample --enable-swscale \
            --enable-demuxer=mp4,mov,matroska,webm,mp3,mpegts,hls,flv,ogg,flac,wav,aac,concat,image2,webp_pipe,png_pipe,mjpeg \
            --enable-muxer=mp4,matroska,webm,mp3,mpegts,ogg,flac,wav,ipod,image2,mjpeg \
            --enable-decoder=h264,hevc,vp8,vp9,av1,aac,opus,vorbis,mp3,flac,alac,pcm_s16le,pcm_s24le,pcm_f32le,webp,png,mjpeg \
            --enable-encoder=aac,libmp3lame,png,mjpeg \
            --enable-parser=h264,hevc,vp8,vp9,av1,aac,opus,vorbis,mpegaudio,flac \
            --enable-bsf=aac_adtstoasc,h264_mp4toannexb,hevc_mp4toannexb,vp9_superframe,extract_extradata \
            --enable-protocol=file,pipe,crypto \
            --enable-filter=aresample,anull,scale 2>&1 | tail -15
          make -j"$(nproc)" 2>&1 | tail -5
          make install 2>&1 | tail -3
          # Verify WITHOUT executing: this is an ARM binary, running it
          # on the x86 runner fails with "Exec format error" (run 5's
          # lesson — the build itself was fine, only my check was wrong).
          # The libmp3lame string check is fatal: without it the app's
          # MP3 mode would fail on the phone with no encoder.
          test -s ../ffmpeg-install/bin/ffmpeg && file ../ffmpeg-install/bin/ffmpeg
          test -s ../ffmpeg-install/bin/ffprobe && file ../ffmpeg-install/bin/ffprobe
          strings ../ffmpeg-install/bin/ffmpeg | grep -q libmp3lame
          mkdir -p ../ffmpeg-pkg/bin
          cp ../ffmpeg-install/bin/ffmpeg ../ffmpeg-pkg/bin/ffmpeg
          cp ../ffmpeg-install/bin/ffprobe ../ffmpeg-pkg/bin/ffprobe
          cd ..
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile('ffmpeg32.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('ffmpeg-pkg/bin/ffmpeg', 'bin/ffmpeg')
              z.write('ffmpeg-pkg/bin/ffprobe', 'bin/ffprobe')
          EOF
          ls -la ffmpeg32.zip
      - name: Upload ffmpeg32.zip to runtime-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload runtime-latest ffmpeg32.zip --repo "${{ github.repository }}" --clobber

  ffmpeg64:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Cross-compile ffmpeg for arm64-v8a
        run: |
          set -o pipefail
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          # ffmpeg.org's TLS fails from these runners (exit 35, twice in a
          # row after two good downloads), so fetch the same release
          # from FFmpeg's GitHub mirror instead.
          curl -fsSL --retry 3 --retry-all-errors -o ffmpeg.tar.gz https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n7.1.tar.gz
          tar xf ffmpeg.tar.gz
          # libmp3lame first: the app's audio-only mode now produces real
          # MP3 (yt-dlp --extract-audio --audio-format mp3), and the
          # stock ffmpeg build has no MP3 encoder. Static, PIC (it is
          # linked into ffmpeg's PIE binary), frontend off (we only
          # need the library, not lame's CLI).
          curl -fsSL --retry 3 --retry-all-errors -o lame.tar.gz https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz
          tar xf lame.tar.gz
          cd lame-3.100
          CC="$NDK_BIN/aarch64-linux-android21-clang" \
            CFLAGS="-O2 -fPIC" \
            ./configure --host=aarch64-linux-android \
            --disable-shared --enable-static --disable-frontend \
            --prefix="$PWD/../lame-install" 2>&1 | tail -5
          make -j"$(nproc)" 2>&1 | tail -3
          make install 2>&1 | tail -3
          cd ..
          cd FFmpeg-n7.1
          ./configure \
            --target-os=android --arch=aarch64 --cpu=armv8-a \
            --enable-cross-compile \
            --cross-prefix="$NDK_BIN/aarch64-linux-android-" \
            --cc="$NDK_BIN/aarch64-linux-android21-clang" \
            --ar="$NDK_BIN/llvm-ar" --ranlib="$NDK_BIN/llvm-ranlib" \
            --nm="$NDK_BIN/llvm-nm" --strip="$NDK_BIN/llvm-strip" \
            --sysroot="$SYSROOT" \
            --prefix="$PWD/../ffmpeg-install" \
            --enable-libmp3lame \
            --extra-cflags="-I$PWD/../lame-install/include" \
            --extra-ldflags="-L$PWD/../lame-install/lib -Wl,-z,max-page-size=16384" \
            --disable-doc --disable-ffplay \
            --disable-avdevice --disable-network \
            --disable-vulkan \
            --disable-everything \
            --enable-swresample --enable-swscale \
            --enable-demuxer=mp4,mov,matroska,webm,mp3,mpegts,hls,flv,ogg,flac,wav,aac,concat,image2,webp_pipe,png_pipe,mjpeg \
            --enable-muxer=mp4,matroska,webm,mp3,mpegts,ogg,flac,wav,ipod,image2,mjpeg \
            --enable-decoder=h264,hevc,vp8,vp9,av1,aac,opus,vorbis,mp3,flac,alac,pcm_s16le,pcm_s24le,pcm_f32le,webp,png,mjpeg \
            --enable-encoder=aac,libmp3lame,png,mjpeg \
            --enable-parser=h264,hevc,vp8,vp9,av1,aac,opus,vorbis,mpegaudio,flac \
            --enable-bsf=aac_adtstoasc,h264_mp4toannexb,hevc_mp4toannexb,vp9_superframe,extract_extradata \
            --enable-protocol=file,pipe,crypto \
            --enable-filter=aresample,anull,scale 2>&1 | tail -15
          make -j"$(nproc)" 2>&1 | tail -5
          make install 2>&1 | tail -3
          # Verify WITHOUT executing: this is an ARM binary, running it
          # on the x86 runner fails with "Exec format error".
          # The libmp3lame string check is fatal: without it the app's
          # MP3 mode would fail on the phone with no encoder.
          test -s ../ffmpeg-install/bin/ffmpeg && file ../ffmpeg-install/bin/ffmpeg
          test -s ../ffmpeg-install/bin/ffprobe && file ../ffmpeg-install/bin/ffprobe
          strings ../ffmpeg-install/bin/ffmpeg | grep -q libmp3lame
          mkdir -p ../ffmpeg-pkg/bin
          cp ../ffmpeg-install/bin/ffmpeg ../ffmpeg-pkg/bin/ffmpeg
          cp ../ffmpeg-install/bin/ffprobe ../ffmpeg-pkg/bin/ffprobe
          cd ..
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile('ffmpeg64.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('ffmpeg-pkg/bin/ffmpeg', 'bin/ffmpeg')
              z.write('ffmpeg-pkg/bin/ffprobe', 'bin/ffprobe')
          EOF
          ls -la ffmpeg64.zip
      - name: Upload ffmpeg64.zip to runtime-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload runtime-latest ffmpeg64.zip --repo "${{ github.repository }}" --clobber

  cpython:
    needs: prepare-release
    # Standalone CPython 3.13 for armeabi-v7a. Run 5 proved p4a only
    # produces a JNI library (libpython3.14.so), not a runnable
    # interpreter, so Python is cross-compiled directly: a host python,
    # then static OpenSSL/libffi/xz, then the target build with
    # --enable-shared. Shared is REQUIRED, not optional: a static build
    # has no libpython3.13.so, and ctypes (imported at startup via
    # platform.android_ver) dies with "dlopen failed: library
    # libpython3.13.so not found" (seen on device in v0.2.4). The app
    # sets LD_LIBRARY_PATH to runtime/python/lib so both the
    # interpreter and ctypes find it. Layout matches
    # RuntimeExtractor: bin/python + lib/python3.13/ + lib/libpython*.
    runs-on: ubuntu-latest
    steps:
      - name: Install cross-build tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq autoconf automake libtool libtool-bin libltdl-dev
      - name: Cache native deps
        uses: actions/cache@v4
        with:
          # Only the small, version-pinned dep installs are cached;
          # each dep writes a .done marker only after a full install,
          # so a partial install is never reused. Bump the key suffix
          # when a dep version or build flag changes (v3: openssl no-asm).
          path: deps-install
          key: cpython-deps-openssl3.2.0-libffi3.4.2-xz5.4.0-v3
      - name: Download sources
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o cpython.tar.gz https://github.com/python/cpython/archive/refs/tags/v3.13.0.tar.gz
          tar xf cpython.tar.gz
          mv cpython-3.13.0 cpython-host
          tar xf cpython.tar.gz
          mv cpython-3.13.0 cpython-target
          curl -fsSL --retry 3 --retry-all-errors -o openssl.tar.gz https://github.com/openssl/openssl/archive/refs/tags/openssl-3.2.0.tar.gz
          tar xf openssl.tar.gz
          curl -fsSL --retry 3 --retry-all-errors -o libffi.tar.gz https://github.com/libffi/libffi/archive/v3.4.2.tar.gz
          tar xf libffi.tar.gz
          curl -fsSL --retry 3 --retry-all-errors -o xz.tar.gz https://github.com/tukaani-project/xz/releases/download/v5.4.0/xz-5.4.0.tar.gz || echo "XZ_DOWNLOAD_FAILED" > xz.failed
          if [ ! -f xz.failed ]; then tar xf xz.tar.gz; fi
          ls -d cpython-host cpython-target openssl-openssl-3.2.0 libffi-3.4.2 xz-5.4.0 2>/dev/null || true
      - name: Build host python
        run: |
          set -o pipefail
          cd cpython-host
          ./configure --prefix="$PWD/../host-install" --disable-test-modules --without-ensurepip 2>&1 | tee ../host-configure.log | tail -3
          make -j"$(nproc)" 2>&1 | tee ../host-build.log | tail -3
          make install 2>&1 | tee ../host-install.log | tail -3
          cd ..
          ls -la host-install/bin/python3.13
      - name: Build native deps (static)
        run: |
          set -o pipefail
          # OpenSSL's android config (Configurations/15-android.conf)
          # only accepts a toolchain found by which("clang") inside
          # $ANDROID_NDK_ROOT/.../prebuilt/ — it reads ANDROID_NDK_ROOT
          # (not ANDROID_NDK_HOME) and rejects compilers found elsewhere
          # by that pattern match. Symlinks in a private dir failed run 7
          # for exactly that reason, so: use that same NDK dir, export it
          # explicitly, and put its bin dir on PATH.
          NDK_ROOT="${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}"
          export ANDROID_NDK_ROOT="$NDK_ROOT"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          mkdir -p deps-install
          if [ ! -f deps-install/openssl/.done ]; then
            cd openssl-openssl-3.2.0
            ./Configure android-arm -D__ANDROID_API__=21 --prefix="$PWD/../deps-install/openssl" no-shared no-tests no-asm -fPIC 2>&1 | tee ../openssl-configure.log | tail -3
            # -fPIC is required even for a static-only build: with
            # no-shared OpenSSL drops PIC, and CPython's _ssl/_hashlib
            # shared modules then fail to link (R_ARM_REL32, run 10).
            # libffi/xz static libs were already PIC-safe. no-asm is
            # also required: OpenSSL's ARM asm reaches OPENSSL_armcap_P
            # with an absolute relocation that lld refuses in a .so even
            # with -fPIC (run 11 proved it). Pure-C crypto is plenty
            # fast for TLS handshakes and hashing here.
            make -j"$(nproc)" build_sw 2>&1 | tee ../openssl-build.log | tail -3
            make install_sw 2>&1 | tee ../openssl-install.log | tail -3
            touch "$PWD/../deps-install/openssl/.done"
            cd ..
          else
            echo "openssl: restored from cache, skipping"
          fi
          if [ ! -f deps-install/libffi/.done ]; then
            cd libffi-3.4.2
            ./autogen.sh 2>&1 | tee ../libffi-autogen.log | tail -3
            CC="$NDK_BIN/armv7a-linux-androideabi21-clang" AR="$NDK_BIN/llvm-ar" RANLIB="$NDK_BIN/llvm-ranlib" \
              ./configure --host=arm-linux-androideabi --prefix="$PWD/../deps-install/libffi" --disable-shared --enable-static --disable-docs 2>&1 | tee ../libffi-configure.log | tail -3
            # Build ONLY libffi.la, not plain "make": libffi uses
            # AX_ENABLE_BUILDDIR, whose top-level "all-configured"
            # wrapper breaks on plain make when cross-compiling (the
            # library itself links fine first — run 9 proved that).
            # p4a's recipe uses "make libffi.la" for the same reason.
            make libffi.la -j"$(nproc)" 2>&1 | tee ../libffi-build.log | tail -3
            make install 2>&1 | tee ../libffi-install.log | tail -3
            touch "$PWD/../deps-install/libffi/.done"
            cd ..
          else
            echo "libffi: restored from cache, skipping"
          fi
          if [ ! -f xz.failed ] && [ ! -f deps-install/xz/.done ]; then
            cd xz-5.4.0
            CC="$NDK_BIN/armv7a-linux-androideabi21-clang" AR="$NDK_BIN/llvm-ar" RANLIB="$NDK_BIN/llvm-ranlib" \
              ./configure --host=arm-linux-androideabi --prefix="$PWD/../deps-install/xz" --disable-shared --enable-static --disable-doc 2>&1 | tee ../xz-configure.log | tail -3
            make -j"$(nproc)" 2>&1 | tee ../xz-build.log | tail -3
            make install 2>&1 | tee ../xz-install.log | tail -3
            touch "$PWD/../deps-install/xz/.done"
            cd ..
          elif [ -f xz.failed ]; then
            echo "xz: download failed earlier, continuing without _lzma"
          else
            echo "xz: restored from cache, skipping"
          fi
      - name: Cross-compile target python
        run: |
          set -o pipefail
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p target-build && cd target-build
          export PKG_CONFIG_LIBDIR="$PWD/../deps-install/libffi/lib/pkgconfig:$PWD/../deps-install/xz/lib/pkgconfig"
          CC="$NDK_BIN/armv7a-linux-androideabi21-clang" \
            AR="$NDK_BIN/llvm-ar" RANLIB="$NDK_BIN/llvm-ranlib" \
            CFLAGS="-I$PWD/../deps-install/openssl/include -I$PWD/../deps-install/libffi/include -I$PWD/../deps-install/xz/include" \
            LDFLAGS="-L$PWD/../deps-install/openssl/lib -L$PWD/../deps-install/openssl/lib64 -L$PWD/../deps-install/libffi/lib -L$PWD/../deps-install/xz/lib -Wl,-rpath,\$ORIGIN -Wl,--enable-new-dtags" \
            ../cpython-target/configure \
            --host=armv7a-linux-androideabi \
            --build=x86_64-linux-gnu \
            --with-build-python="$PWD/../host-install/bin/python3.13" \
            --prefix="$PWD/../target-install" \
            --disable-test-modules \
            --without-ensurepip \
            --enable-shared \
            --with-openssl="$PWD/../deps-install/openssl" 2>&1 | tee ../target-configure.log | tail -5
          make -j"$(nproc)" 2>&1 | tee ../target-build.log | tail -5
          make install 2>&1 | tee ../target-install.log | tail -3
          cd ..
          echo "--- modules that failed to build (if any) ---"
          grep -iE "failed to build|not built" target-build.log | head -20 || true
          file target-install/bin/python3.13
          ls target-install/lib/python3.13/lib-dynload/ | head -40
      - name: Package python zips (shared + 32-bit)
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p python-pkg/bin python-pkg/lib
          cp target-install/bin/python3.13 python-pkg/bin/python
          cp -r target-install/lib/python3.13 python-pkg/lib/
          cp target-install/lib/libpython3.13.so* python-pkg/lib/
          find python-pkg -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true
          # Strip DWARF debug info from interpreter, libpython, and dynload
          # modules (cuts python32.zip from ~17 MB down to ~4-5 MB).
          "$NDK_BIN/llvm-strip" --strip-unneeded python-pkg/bin/python python-pkg/lib/libpython3.13.so* python-pkg/lib/python3.13/lib-dynload/*.so
          python3 - <<'EOF'
          import zipfile, os
          # Split the staged tree: shared holds the arch-independent
          # stdlib .py files; arch holds native binaries + per-arch
          # _sysconfigdata (so 64-bit never misses its sysconfigdata).
          # Dead build artifacts and desktop-only stdlib modules
          # (idlelib, tkinter, turtledemo, ensurepip, pydoc_data, config-*)
          # are dropped to keep the APK lean and extraction fast.
          drop_dirs = (
              '/config-', '/idlelib/', '/tkinter/', '/turtledemo/',
              '/ensurepip/', '/pydoc_data/', '/test/', '/unittest/'
          )
          def bucket(rel):
              if rel.endswith(('.a', '.o')):
                  return None
              if any(d in rel for d in drop_dirs):
                  return None
              if rel.startswith('bin/'):
                  return 'arch'
              if rel.endswith('.so') or '/lib-dynload/' in rel:
                  return 'arch'
              if '_sysconfigdata' in rel:
                  return 'arch'
              return 'shared'
          shared, arch = [], []
          for root, _, files in os.walk('python-pkg'):
              for f in files:
                  p = os.path.join(root, f)
                  rel = os.path.relpath(p, 'python-pkg')
                  b = bucket(rel)
                  if b == 'shared':
                      shared.append((p, rel))
                  elif b == 'arch':
                      arch.append((p, rel))
          with zipfile.ZipFile('python-shared.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p, rel in shared:
                  z.write(p, rel)
          with zipfile.ZipFile('python32.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p, rel in arch:
                  z.write(p, rel)
          print('shared entries:', len(shared), 'arch entries:', len(arch))
          EOF
          ls -la python-shared.zip python32.zip
          python3 -c "import zipfile; s=set(zipfile.ZipFile('python-shared.zip').namelist()); a=set(zipfile.ZipFile('python32.zip').namelist()); assert not (s & a); assert not any('_sysconfigdata' in x for x in s), 'sysconfigdata leaked into shared'; assert any('_sysconfigdata' in x for x in a), 'sysconfigdata missing from python32'; print('OK: bin/python:', 'bin/python' in a, 'libpython:', any('libpython3.13.so' in x for x in a))"
      - name: Upload python-shared.zip and python32.zip to runtime-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload runtime-latest python-shared.zip python32.zip --repo "${{ github.repository }}" --clobber

  cpython64:
    needs: prepare-release
    # Standalone CPython 3.13 for arm64-v8a — same recipe as the 32-bit
    # job, with the aarch64 toolchain throughout. Native deps get their
    # own cache key/path (deps-install-64) so the armv7 cache is never
    # restored here. Only the arch zip is packaged: the shared stdlib
    # zip is arch-independent and comes from the 32-bit job.
    runs-on: ubuntu-latest
    steps:
      - name: Install cross-build tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq autoconf automake libtool libtool-bin libltdl-dev
      - name: Cache native deps
        uses: actions/cache@v4
        with:
          # Separate cache from the 32-bit job: restoring armv7 deps
          # here would silently link the wrong architecture.
          path: deps-install-64
          key: cpython-deps-openssl3.2.0-libffi3.4.2-xz5.4.0-arm64-v3
      - name: Download sources
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o cpython.tar.gz https://github.com/python/cpython/archive/refs/tags/v3.13.0.tar.gz
          tar xf cpython.tar.gz
          mv cpython-3.13.0 cpython-host
          tar xf cpython.tar.gz
          mv cpython-3.13.0 cpython-target
          curl -fsSL --retry 3 --retry-all-errors -o openssl.tar.gz https://github.com/openssl/openssl/archive/refs/tags/openssl-3.2.0.tar.gz
          tar xf openssl.tar.gz
          curl -fsSL --retry 3 --retry-all-errors -o libffi.tar.gz https://github.com/libffi/libffi/archive/v3.4.2.tar.gz
          tar xf libffi.tar.gz
          curl -fsSL --retry 3 --retry-all-errors -o xz.tar.gz https://github.com/tukaani-project/xz/releases/download/v5.4.0/xz-5.4.0.tar.gz || echo "XZ_DOWNLOAD_FAILED" > xz.failed
          if [ ! -f xz.failed ]; then tar xf xz.tar.gz; fi
          ls -d cpython-host cpython-target openssl-openssl-3.2.0 libffi-3.4.2 xz-5.4.0 2>/dev/null || true
      - name: Build host python
        run: |
          set -o pipefail
          cd cpython-host
          ./configure --prefix="$PWD/../host-install" --disable-test-modules --without-ensurepip 2>&1 | tee ../host-configure.log | tail -3
          make -j"$(nproc)" 2>&1 | tee ../host-build.log | tail -3
          make install 2>&1 | tee ../host-install.log | tail -3
          cd ..
          ls -la host-install/bin/python3.13
      - name: Build native deps (static)
        run: |
          set -o pipefail
          # Same NDK-root rule as the 32-bit job: OpenSSL's android
          # config only accepts a toolchain found by which("clang")
          # inside $ANDROID_NDK_ROOT/.../prebuilt/.
          NDK_ROOT="${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}"
          export ANDROID_NDK_ROOT="$NDK_ROOT"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          mkdir -p deps-install-64
          if [ ! -f deps-install-64/openssl/.done ]; then
            cd openssl-openssl-3.2.0
            ./Configure android-arm64 -D__ANDROID_API__=21 --prefix="$PWD/../deps-install-64/openssl" no-shared no-tests no-asm -fPIC 2>&1 | tee ../openssl-configure.log | tail -3
            make -j"$(nproc)" build_sw 2>&1 | tee ../openssl-build.log | tail -3
            make install_sw 2>&1 | tee ../openssl-install.log | tail -3
            touch "$PWD/../deps-install-64/openssl/.done"
            cd ..
          else
            echo "openssl: restored from cache, skipping"
          fi
          if [ ! -f deps-install-64/libffi/.done ]; then
            cd libffi-3.4.2
            ./autogen.sh 2>&1 | tee ../libffi-autogen.log | tail -3
            CC="$NDK_BIN/aarch64-linux-android21-clang" AR="$NDK_BIN/llvm-ar" RANLIB="$NDK_BIN/llvm-ranlib" \
              ./configure --host=aarch64-linux-android --prefix="$PWD/../deps-install-64/libffi" --disable-shared --enable-static --disable-docs 2>&1 | tee ../libffi-configure.log | tail -3
            # Build ONLY libffi.la, not plain "make" (same AX_ENABLE_BUILDDIR
            # reason as the 32-bit job).
            make libffi.la -j"$(nproc)" 2>&1 | tee ../libffi-build.log | tail -3
            make install 2>&1 | tee ../libffi-install.log | tail -3
            touch "$PWD/../deps-install-64/libffi/.done"
            cd ..
          else
            echo "libffi: restored from cache, skipping"
          fi
          if [ ! -f xz.failed ] && [ ! -f deps-install-64/xz/.done ]; then
            cd xz-5.4.0
            CC="$NDK_BIN/aarch64-linux-android21-clang" AR="$NDK_BIN/llvm-ar" RANLIB="$NDK_BIN/llvm-ranlib" \
              ./configure --host=aarch64-linux-android --prefix="$PWD/../deps-install-64/xz" --disable-shared --enable-static --disable-doc 2>&1 | tee ../xz-configure.log | tail -3
            make -j"$(nproc)" 2>&1 | tail -3
            make install 2>&1 | tail -3
            touch "$PWD/../deps-install-64/xz/.done"
            cd ..
          elif [ -f xz.failed ]; then
            echo "xz: download failed earlier, continuing without _lzma"
          else
            echo "xz: restored from cache, skipping"
          fi
      - name: Cross-compile target python
        run: |
          set -o pipefail
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p target-build && cd target-build
          export PKG_CONFIG_LIBDIR="$PWD/../deps-install-64/libffi/lib/pkgconfig:$PWD/../deps-install-64/xz/lib/pkgconfig"
          CC="$NDK_BIN/aarch64-linux-android21-clang" \
            AR="$NDK_BIN/llvm-ar" RANLIB="$NDK_BIN/llvm-ranlib" \
            CFLAGS="-I$PWD/../deps-install-64/openssl/include -I$PWD/../deps-install-64/libffi/include -I$PWD/../deps-install-64/xz/include" \
            LDFLAGS="-L$PWD/../deps-install-64/openssl/lib -L$PWD/../deps-install-64/openssl/lib64 -L$PWD/../deps-install-64/libffi/lib -L$PWD/../deps-install-64/xz/lib -Wl,-z,max-page-size=16384 -Wl,-rpath,\$ORIGIN -Wl,--enable-new-dtags" \
            ../cpython-target/configure \
            --host=aarch64-linux-android \
            --build=x86_64-linux-gnu \
            --with-build-python="$PWD/../host-install/bin/python3.13" \
            --prefix="$PWD/../target-install" \
            --disable-test-modules \
            --without-ensurepip \
            --enable-shared \
            --with-openssl="$PWD/../deps-install-64/openssl" 2>&1 | tee ../target-configure.log | tail -5
          make -j"$(nproc)" 2>&1 | tee ../target-build.log | tail -5
          make install 2>&1 | tee ../target-install.log | tail -3
          cd ..
          echo "--- modules that failed to build (if any) ---"
          grep -iE "failed to build|not built" target-build.log | head -20 || true
          file target-install/bin/python3.13
          ls target-install/lib/python3.13/lib-dynload/ | head -40
      - name: Package python zip (64-bit arch only)
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p python-pkg/bin python-pkg/lib
          cp target-install/bin/python3.13 python-pkg/bin/python
          cp -r target-install/lib/python3.13 python-pkg/lib/
          cp target-install/lib/libpython3.13.so* python-pkg/lib/
          find python-pkg -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true
          "$NDK_BIN/llvm-strip" --strip-unneeded python-pkg/bin/python python-pkg/lib/libpython3.13.so* python-pkg/lib/python3.13/lib-dynload/*.so
          python3 - <<'EOF'
          import zipfile, os
          # Same split as the 32-bit job, including 64-bit _sysconfigdata
          # so sysconfig works on arm64-v8a devices.
          drop_dirs = (
              '/config-', '/idlelib/', '/tkinter/', '/turtledemo/',
              '/ensurepip/', '/pydoc_data/', '/test/', '/unittest/'
          )
          def bucket(rel):
              if rel.endswith(('.a', '.o')):
                  return None
              if any(d in rel for d in drop_dirs):
                  return None
              if rel.startswith('bin/'):
                  return 'arch'
              if rel.endswith('.so') or '/lib-dynload/' in rel:
                  return 'arch'
              if '_sysconfigdata' in rel:
                  return 'arch'
              return 'shared'
          arch = []
          for root, _, files in os.walk('python-pkg'):
              for f in files:
                  p = os.path.join(root, f)
                  rel = os.path.relpath(p, 'python-pkg')
                  if bucket(rel) == 'arch':
                      arch.append((p, rel))
          with zipfile.ZipFile('python64.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p, rel in arch:
                  z.write(p, rel)
          print('arch entries:', len(arch))
          EOF
          ls -la python64.zip
          python3 -c "import zipfile; a=set(zipfile.ZipFile('python64.zip').namelist()); assert any('_sysconfigdata' in x for x in a), 'sysconfigdata missing from python64'; print('OK: bin/python:', 'bin/python' in a, 'libpython:', any('libpython3.13.so' in x for x in a))"
      - name: Upload python64.zip to runtime-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload runtime-latest python64.zip --repo "${{ github.repository }}" --clobber
