name: Package runtime

# Builds the four native runtime zips RuntimeExtractor expects in
# assets/runtime/ (python, yt-dlp, QuickJS, ffmpeg) for armeabi-v7a.
# Manual trigger only: `gh workflow run package-runtime.yml`.
# Each job uploads its zip (or probe files) as an artifact; jobs are
# independent, so one failing does not block the others.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ytdlp:
    runs-on: ubuntu-latest
    steps:
      - name: Build yt-dlp package zip
        run: |
          rm -rf ytdlp-build && mkdir -p ytdlp-build/pkg
          cd ytdlp-build
          python3 -m pip download "yt-dlp[default]" -d wheels
          ls wheels
          cd pkg
          for w in ../wheels/*.whl; do python3 -m zipfile -e "$w" .; done
          printf 'import sys\nfrom yt_dlp import main\nsys.exit(main())\n' > yt-dlp
          cd ..
          python3 - <<'EOF'
          import zipfile, os
          skip = ('.dist-info', '__pycache__')
          with zipfile.ZipFile('ytdlp.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk('pkg'):
                  for f in files:
                      p = os.path.join(root, f)
                      rel = os.path.relpath(p, 'pkg')
                      if any(s in rel for s in skip):
                          continue
                      z.write(p, rel)
          EOF
          ls -la ytdlp.zip
          python3 -c "import zipfile; print('\n'.join(sorted(zipfile.ZipFile('ytdlp.zip').namelist())[:8]))"
      - uses: actions/upload-artifact@v4
        with:
          name: ytdlp-zip
          path: ytdlp-build/ytdlp.zip

  qjs:
    runs-on: ubuntu-latest
    steps:
      - name: Cross-compile QuickJS for armeabi-v7a
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          curl -fsSL --retry 3 -o quickjs.tar.xz https://bellard.org/quickjs/quickjs-2024-01-13.tar.xz
          tar xf quickjs.tar.xz
          # Host build first: its runnable qjsc generates repl.c/qjscalc.c.
          # The cross Makefile would try to RUN the ARM qjsc on this x86
          # runner, which fails, so the target binary is compiled with one
          # direct clang invocation instead. bionic bundles pthread into
          # libc, so no -lpthread on the target link.
          cp -r quickjs-2024-01-13 quickjs-host
          (cd quickjs-host && make qjs -j"$(nproc)")
          cp quickjs-host/repl.c quickjs-host/qjscalc.c quickjs-2024-01-13/
          cd quickjs-2024-01-13
          "$NDK_BIN/armv7a-linux-androideabi21-clang" -O2 -fwrapv \
            -D_GNU_SOURCE -DCONFIG_VERSION='"2024-01-13"' -DCONFIG_BIGNUM \
            -o qjs qjs.c repl.c qjscalc.c quickjs.c libregexp.c libunicode.c \
            cutils.c quickjs-libc.c libbf.c -lm -ldl
          mkdir -p ../qjs-pkg/bin
          cp qjs ../qjs-pkg/bin/qjs
          cd ..
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile('qjs.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('qjs-pkg/bin/qjs', 'bin/qjs')
          EOF
          ls -la qjs.zip
      - uses: actions/upload-artifact@v4
        with:
          name: qjs-zip
          path: qjs.zip

  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - name: Cross-compile ffmpeg for armeabi-v7a
        run: |
          set -o pipefail
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          # ffmpeg.org's TLS fails from these runners (exit 35, twice in a
          # row after two good downloads), so fetch the same release
          # from FFmpeg's GitHub mirror instead.
          curl -fsSL --retry 3 --retry-all-errors -o ffmpeg.tar.gz https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n7.1.tar.gz
          tar xf ffmpeg.tar.gz
          cd FFmpeg-n7.1
          ./configure \
            --target-os=android --arch=arm --cpu=armv7-a \
            --enable-cross-compile \
            --cross-prefix="$NDK_BIN/armv7a-linux-androideabi-" \
            --cc="$NDK_BIN/armv7a-linux-androideabi21-clang" \
            --ar="$NDK_BIN/llvm-ar" --ranlib="$NDK_BIN/llvm-ranlib" \
            --nm="$NDK_BIN/llvm-nm" --strip="$NDK_BIN/llvm-strip" \
            --sysroot="$SYSROOT" \
            --prefix="$PWD/../ffmpeg-install" \
            --disable-doc --disable-ffplay --disable-ffprobe \
            --disable-avdevice --disable-network --disable-swscale \
            --disable-vulkan \
            --disable-everything \
            --enable-swresample \
            --enable-demuxer=mp4,mov,matroska,webm \
            --enable-muxer=mp4,matroska,webm \
            --enable-decoder=h264,aac,opus,vorbis,mp3 \
            --enable-encoder=aac \
            --enable-parser=h264,aac,opus,vorbis,mpegaudio \
            --enable-bsf=aac_adtstoasc,h264_mp4toannexb \
            --enable-protocol=file,pipe \
            --enable-filter=aresample,anull 2>&1 | tail -15
          make -j"$(nproc)" 2>&1 | tail -5
          make install 2>&1 | tail -3
          # Verify WITHOUT executing: this is an ARM binary, running it
          # on the x86 runner fails with "Exec format error" (run 5's
          # lesson — the build itself was fine, only my check was wrong).
          test -s ../ffmpeg-install/bin/ffmpeg && file ../ffmpeg-install/bin/ffmpeg
          mkdir -p ../ffmpeg-pkg/bin
          cp ../ffmpeg-install/bin/ffmpeg ../ffmpeg-pkg/bin/ffmpeg
          cd ..
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile('ffmpeg.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('ffmpeg-pkg/bin/ffmpeg', 'bin/ffmpeg')
          EOF
          ls -la ffmpeg.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-zip
          path: ffmpeg.zip

  cpython:
    # Standalone CPython 3.13 for armeabi-v7a. Run 5 proved p4a only
    # produces a JNI library (libpython3.14.so), not a runnable
    # interpreter, so Python is cross-compiled directly: a host python,
    # then static OpenSSL/libffi/xz (static so no LD_LIBRARY_PATH is
    # needed on device), then the target build with --disable-shared
    # (no libpython .so needed at runtime). Layout matches
    # RuntimeExtractor: bin/python + lib/python3.13/.
    runs-on: ubuntu-latest
    steps:
      - name: Install cross-build tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq autoconf automake libtool libtool-bin libltdl-dev
      - name: Cache native deps
        uses: actions/cache@v4
        with:
          # Only the small, version-pinned dep installs are cached;
          # each dep writes a .done marker only after a full install,
          # so a partial install is never reused. Bump the key suffix
          # when a dep version or build flag changes (v3: openssl no-asm).
          path: deps-install
          key: cpython-deps-openssl3.2.0-libffi3.4.2-xz5.4.0-v3
      - name: Download sources
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o cpython.tar.gz https://github.com/python/cpython/archive/refs/tags/v3.13.0.tar.gz
          tar xf cpython.tar.gz
          mv cpython-3.13.0 cpython-host
          tar xf cpython.tar.gz
          mv cpython-3.13.0 cpython-target
          curl -fsSL --retry 3 --retry-all-errors -o openssl.tar.gz https://github.com/openssl/openssl/archive/refs/tags/openssl-3.2.0.tar.gz
          tar xf openssl.tar.gz
          curl -fsSL --retry 3 --retry-all-errors -o libffi.tar.gz https://github.com/libffi/libffi/archive/v3.4.2.tar.gz
          tar xf libffi.tar.gz
          curl -fsSL --retry 3 --retry-all-errors -o xz.tar.gz https://github.com/tukaani-project/xz/releases/download/v5.4.0/xz-5.4.0.tar.gz || echo "XZ_DOWNLOAD_FAILED" > xz.failed
          if [ ! -f xz.failed ]; then tar xf xz.tar.gz; fi
          ls -d cpython-host cpython-target openssl-openssl-3.2.0 libffi-3.4.2 xz-5.4.0 2>/dev/null || true
      - name: Build host python
        run: |
          set -o pipefail
          cd cpython-host
          ./configure --prefix="$PWD/../host-install" --disable-test-modules --without-ensurepip 2>&1 | tee ../host-configure.log | tail -3
          make -j"$(nproc)" 2>&1 | tee ../host-build.log | tail -3
          make install 2>&1 | tee ../host-install.log | tail -3
          cd ..
          ls -la host-install/bin/python3.13
      - name: Build native deps (static)
        run: |
          set -o pipefail
          # OpenSSL's android config (Configurations/15-android.conf)
          # only accepts a toolchain found by which("clang") inside
          # $ANDROID_NDK_ROOT/.../prebuilt/ — it reads ANDROID_NDK_ROOT
          # (not ANDROID_NDK_HOME) and rejects compilers found elsewhere
          # by that pattern match. Symlinks in a private dir failed run 7
          # for exactly that reason, so: use that same NDK dir, export it
          # explicitly, and put its bin dir on PATH.
          NDK_ROOT="${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}"
          export ANDROID_NDK_ROOT="$NDK_ROOT"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          mkdir -p deps-install
          if [ ! -f deps-install/openssl/.done ]; then
            cd openssl-openssl-3.2.0
            ./Configure android-arm -D__ANDROID_API__=21 --prefix="$PWD/../deps-install/openssl" no-shared no-tests no-asm -fPIC 2>&1 | tee ../openssl-configure.log | tail -3
            # -fPIC is required even for a static-only build: with
            # no-shared OpenSSL drops PIC, and CPython's _ssl/_hashlib
            # shared modules then fail to link (R_ARM_REL32, run 10).
            # libffi/xz static libs were already PIC-safe. no-asm is
            # also required: OpenSSL's ARM asm reaches OPENSSL_armcap_P
            # with an absolute relocation that lld refuses in a .so even
            # with -fPIC (run 11 proved it). Pure-C crypto is plenty
            # fast for TLS handshakes and hashing here.
            make -j"$(nproc)" build_sw 2>&1 | tee ../openssl-build.log | tail -3
            make install_sw 2>&1 | tee ../openssl-install.log | tail -3
            touch "$PWD/../deps-install/openssl/.done"
            cd ..
          else
            echo "openssl: restored from cache, skipping"
          fi
          if [ ! -f deps-install/libffi/.done ]; then
            cd libffi-3.4.2
            ./autogen.sh 2>&1 | tee ../libffi-autogen.log | tail -3
            CC="$NDK_BIN/armv7a-linux-androideabi21-clang" AR="$NDK_BIN/llvm-ar" RANLIB="$NDK_BIN/llvm-ranlib" \
              ./configure --host=arm-linux-androideabi --prefix="$PWD/../deps-install/libffi" --disable-shared --enable-static --disable-docs 2>&1 | tee ../libffi-configure.log | tail -3
            # Build ONLY libffi.la, not plain "make": libffi uses
            # AX_ENABLE_BUILDDIR, whose top-level "all-configured"
            # wrapper breaks on plain make when cross-compiling (the
            # library itself links fine first — run 9 proved that).
            # p4a's recipe uses "make libffi.la" for the same reason.
            make libffi.la -j"$(nproc)" 2>&1 | tee ../libffi-build.log | tail -3
            make install 2>&1 | tee ../libffi-install.log | tail -3
            touch "$PWD/../deps-install/libffi/.done"
            cd ..
          else
            echo "libffi: restored from cache, skipping"
          fi
          if [ ! -f xz.failed ] && [ ! -f deps-install/xz/.done ]; then
            cd xz-5.4.0
            CC="$NDK_BIN/armv7a-linux-androideabi21-clang" AR="$NDK_BIN/llvm-ar" RANLIB="$NDK_BIN/llvm-ranlib" \
              ./configure --host=arm-linux-androideabi --prefix="$PWD/../deps-install/xz" --disable-shared --enable-static --disable-doc 2>&1 | tee ../xz-configure.log | tail -3
            make -j"$(nproc)" 2>&1 | tee ../xz-build.log | tail -3
            make install 2>&1 | tee ../xz-install.log | tail -3
            touch "$PWD/../deps-install/xz/.done"
            cd ..
          elif [ -f xz.failed ]; then
            echo "xz: download failed earlier, continuing without _lzma"
          else
            echo "xz: restored from cache, skipping"
          fi
      - name: Cross-compile target python
        run: |
          set -o pipefail
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p target-build && cd target-build
          export PKG_CONFIG_LIBDIR="$PWD/../deps-install/libffi/lib/pkgconfig:$PWD/../deps-install/xz/lib/pkgconfig"
          CC="$NDK_BIN/armv7a-linux-androideabi21-clang" \
            AR="$NDK_BIN/llvm-ar" RANLIB="$NDK_BIN/llvm-ranlib" \
            CFLAGS="-I$PWD/../deps-install/openssl/include -I$PWD/../deps-install/libffi/include -I$PWD/../deps-install/xz/include" \
            LDFLAGS="-L$PWD/../deps-install/openssl/lib -L$PWD/../deps-install/openssl/lib64 -L$PWD/../deps-install/libffi/lib -L$PWD/../deps-install/xz/lib" \
            ../cpython-target/configure \
            --host=armv7a-linux-androideabi \
            --build=x86_64-linux-gnu \
            --with-build-python="$PWD/../host-install/bin/python3.13" \
            --prefix="$PWD/../target-install" \
            --disable-test-modules \
            --without-ensurepip \
            --with-openssl="$PWD/../deps-install/openssl" 2>&1 | tee ../target-configure.log | tail -5
          make -j"$(nproc)" 2>&1 | tee ../target-build.log | tail -5
          make install 2>&1 | tee ../target-install.log | tail -3
          cd ..
          echo "--- modules that failed to build (if any) ---"
          grep -iE "failed to build|not built" target-build.log | head -20 || true
          file target-install/bin/python3.13
          ls target-install/lib/python3.13/lib-dynload/ | head -40
      - name: Package python zip
        run: |
          mkdir -p python-pkg/bin python-pkg/lib
          cp target-install/bin/python3.13 python-pkg/bin/python
          cp -r target-install/lib/python3.13 python-pkg/lib/
          find python-pkg -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true
          python3 - <<'EOF'
          import zipfile, os
          with zipfile.ZipFile('python.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk('python-pkg'):
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, 'python-pkg'))
          EOF
          ls -la python.zip
          python3 -c "import zipfile; n=zipfile.ZipFile('python.zip').namelist(); print('entries:', len(n)); [print('has', m, ':', any(m in x for x in n)) for m in ['_ssl', '_hashlib', '_socket', '_ctypes', '_lzma']]"
      - uses: actions/upload-artifact@v4
        with:
          name: python-zip
          path: python.zip
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpython-logs
          path: "*.log"
