name: Package runtime

# Builds the four native runtime zips RuntimeExtractor expects in
# assets/runtime/ (python, yt-dlp, QuickJS, ffmpeg) for armeabi-v7a.
# Manual trigger only: `gh workflow run package-runtime.yml`.
# Each job uploads its zip (or probe files) as an artifact; jobs are
# independent, so one failing does not block the others.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ytdlp:
    runs-on: ubuntu-latest
    steps:
      - name: Build yt-dlp package zip
        run: |
          rm -rf ytdlp-build && mkdir -p ytdlp-build/pkg
          cd ytdlp-build
          python3 -m pip download "yt-dlp[default]" -d wheels
          ls wheels
          cd pkg
          for w in ../wheels/*.whl; do python3 -m zipfile -e "$w" .; done
          printf 'import sys\nfrom yt_dlp import main\nsys.exit(main())\n' > yt-dlp
          cd ..
          python3 - <<'EOF'
          import zipfile, os
          skip = ('.dist-info', '__pycache__')
          with zipfile.ZipFile('ytdlp.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk('pkg'):
                  for f in files:
                      p = os.path.join(root, f)
                      rel = os.path.relpath(p, 'pkg')
                      if any(s in rel for s in skip):
                          continue
                      z.write(p, rel)
          EOF
          ls -la ytdlp.zip
          python3 -c "import zipfile; print('\n'.join(sorted(zipfile.ZipFile('ytdlp.zip').namelist())[:8]))"
      - uses: actions/upload-artifact@v4
        with:
          name: ytdlp-zip
          path: ytdlp-build/ytdlp.zip

  qjs:
    runs-on: ubuntu-latest
    steps:
      - name: Cross-compile QuickJS for armeabi-v7a
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          curl -fsSL --retry 3 -o quickjs.tar.xz https://bellard.org/quickjs/quickjs-2024-01-13.tar.xz
          tar xf quickjs.tar.xz
          # Host build first: its runnable qjsc generates repl.c/qjscalc.c.
          # The cross Makefile would try to RUN the ARM qjsc on this x86
          # runner, which fails, so the target binary is compiled with one
          # direct clang invocation instead. bionic bundles pthread into
          # libc, so no -lpthread on the target link.
          cp -r quickjs-2024-01-13 quickjs-host
          (cd quickjs-host && make qjs -j"$(nproc)")
          cp quickjs-host/repl.c quickjs-host/qjscalc.c quickjs-2024-01-13/
          cd quickjs-2024-01-13
          "$NDK_BIN/armv7a-linux-androideabi21-clang" -O2 -fwrapv \
            -D_GNU_SOURCE -DCONFIG_VERSION='"2024-01-13"' -DCONFIG_BIGNUM \
            -o qjs qjs.c repl.c qjscalc.c quickjs.c libregexp.c libunicode.c \
            cutils.c quickjs-libc.c libbf.c -lm -ldl
          mkdir -p ../qjs-pkg/bin
          cp qjs ../qjs-pkg/bin/qjs
          cd ..
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile('qjs.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('qjs-pkg/bin/qjs', 'bin/qjs')
          EOF
          ls -la qjs.zip
      - uses: actions/upload-artifact@v4
        with:
          name: qjs-zip
          path: qjs.zip

  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - name: Cross-compile ffmpeg for armeabi-v7a
        run: |
          set -o pipefail
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          # ffmpeg.org's TLS fails from these runners (exit 35, twice in a
          # row after two good downloads), so fetch the same release
          # from FFmpeg's GitHub mirror instead.
          curl -fsSL --retry 3 --retry-all-errors -o ffmpeg.tar.gz https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n7.1.tar.gz
          tar xf ffmpeg.tar.gz
          cd FFmpeg-n7.1
          ./configure \
            --target-os=android --arch=arm --cpu=armv7-a \
            --enable-cross-compile \
            --cross-prefix="$NDK_BIN/armv7a-linux-androideabi-" \
            --cc="$NDK_BIN/armv7a-linux-androideabi21-clang" \
            --ar="$NDK_BIN/llvm-ar" --ranlib="$NDK_BIN/llvm-ranlib" \
            --nm="$NDK_BIN/llvm-nm" --strip="$NDK_BIN/llvm-strip" \
            --sysroot="$SYSROOT" \
            --prefix="$PWD/../ffmpeg-install" \
            --disable-doc --disable-ffplay --disable-ffprobe \
            --disable-avdevice --disable-network --disable-swscale \
            --disable-vulkan \
            --disable-everything \
            --enable-swresample \
            --enable-demuxer=mp4,mov,matroska,webm \
            --enable-muxer=mp4,matroska,webm \
            --enable-decoder=h264,aac,opus,vorbis,mp3 \
            --enable-encoder=aac \
            --enable-parser=h264,aac,opus,vorbis,mpegaudio \
            --enable-bsf=aac_adtstoasc,h264_mp4toannexb \
            --enable-protocol=file,pipe \
            --enable-filter=aresample,anull 2>&1 | tail -15
          make -j"$(nproc)" 2>&1 | tail -5
          make install 2>&1 | tail -3
          ../ffmpeg-install/bin/ffmpeg -version | head -2
          ../ffmpeg-install/bin/ffmpeg -muxers 2>/dev/null | grep -E " mp4| matroska| webm"
          mkdir -p ../ffmpeg-pkg/bin
          cp ../ffmpeg-install/bin/ffmpeg ../ffmpeg-pkg/bin/ffmpeg
          cd ..
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile('ffmpeg.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('ffmpeg-pkg/bin/ffmpeg', 'bin/ffmpeg')
          EOF
          ls -la ffmpeg.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-zip
          path: ffmpeg.zip

  p4a-probe:
    # Probe only: build a python-for-android distribution for
    # armeabi-v7a and report what it actually produces — specifically
    # whether a runnable python interpreter binary exists in the tree.
    # No zip is assembled here until that question is answered.
    runs-on: ubuntu-latest
    steps:
      - name: Build p4a python3 distribution for armeabi-v7a
        run: |
          set -o pipefail
          # p4a's own libffi recipe notes: it needs automake (aclocal),
          # autoconf (autoreconf), and libltdl-dev — that last package
          # is what defines the LT_SYS_SYMBOL_USCORE macro. Plain
          # libtool alone does not provide it, which is why run 4 failed
          # at the same step even with libtool installed.
          sudo apt-get update -qq && sudo apt-get install -y -qq libtool libtool-bin libltdl-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install python-for-android cython
      - name: Cache p4a build dir (resume, not rebuild)
        uses: actions/cache@v4
        with:
          # p4a reuses a dist's already-built recipes, so a restored dir
          # resumes a failed build instead of restarting it. Bump the
          # -vN suffix whenever the build flags below change, so a stale
          # dist from different flags can never be reused.
          path: ~/.local/share/python-for-android
          key: p4a-armeabi-v7a-python3-api34-v1
      - name: Run p4a create
        run: |
          set -o pipefail
          mkdir -p p4a-probe && cd p4a-probe
          p4a create --requirements=python3 --arch=armeabi-v7a \
            --bootstrap=sdl2 \
            --sdk-dir="$ANDROID_HOME" --ndk-dir="$ANDROID_NDK_LATEST_HOME" \
            --ndk-api=21 --android-api=34 --dist-name=graball-probe 2>&1 | tee p4a-build.log | tail -40
          # NOTE: --android-api is only the SDK platform the runner has
          # (34+ here); --ndk-api=21 is what keeps the result runnable on
          # Android 5.0+ devices.
          echo "--- p4a storage ---"
          ls ~/.local/share/python-for-android/dists/ 2>/dev/null || true
          echo "--- distribution tree (depth 4) ---"
          find ~/.local/share/python-for-android/dists/graball-probe . -maxdepth 4 -type d 2>/dev/null | head -60
          echo "--- python binaries and libs ---"
          find ~/.local/share/python-for-android/dists/graball-probe . -type f \( -name "python*" -o -name "libpython*" \) 2>/dev/null | head -40
          echo "--- stdlib dirs ---"
          find ~/.local/share/python-for-android/dists/graball-probe . -type d -name "python3.*" 2>/dev/null | head -20
      - name: Collect probe files
        if: always()
        run: |
          cd p4a-probe
          find ~/.local/share/python-for-android/dists/graball-probe . -type f \( -name "python*" -o -name "libpython*" -o -path "*lib/python*" \) \
            -not -path "*__pycache__*" 2>/dev/null | head -300 > probe-file-list.txt
          wc -l probe-file-list.txt
          tar czf ../p4a-probe-files.tar.gz --files-from probe-file-list.txt 2>/dev/null || true
          ls -la ../p4a-probe-files.tar.gz probe-file-list.txt p4a-build.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4a-probe
          path: |
            p4a-probe-files.tar.gz
            p4a-probe/probe-file-list.txt
            p4a-probe/p4a-build.log
